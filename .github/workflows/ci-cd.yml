name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 app --max-line-length=88 --extend-ignore=E203
        continue-on-error: true

      - name: Run tests
        run: |
          PYTHONPATH=app pytest app/test --verbose
        continue-on-error: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t dhanraj2525/aryaxai-microservice-pipeline:1.0.0 .
          docker push  dhanraj2525/aryaxai-microservice-pipeline:1.0.0

