name: CI/CD Pipeline

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest autoflake black
        pip install -r app/requirements.txt

    - name: Auto-fix code with autoflake and black
      run: |
        autoflake --in-place --remove-unused-variables --remove-all-unused-imports app/*.py app/test/*.py
        black app/*.py app/test/*.py --line-length=88

    - name: Lint with flake8
      run: |
        flake8 app --max-line-length=88 --extend-ignore=E203